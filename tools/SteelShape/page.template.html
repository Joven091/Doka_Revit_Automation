<main class="app"><nav class="navigation" aria-label="Steel shapes"><h2>Steel Shape</h2><div id="calculator-menu"></div></nav>
<div class="body"><h1 id="page-heading">Steel Shape</h1>
<label class="mobile-picker">Steel shape<select id="calculator-picker" aria-label="Choose a steel shape"></select></label>
<section class="card" aria-labelledby="inputs-heading"><h2 id="inputs-heading">Enter dimensions</h2>
<form id="calculator-form" novalidate><div class="entry-layout"><div><div id="input-fields" class="fields"></div></div>
<section class="schematic-panel" aria-label="Dimensions schematic"><div class="schematic-heading"><span>Schematic · not to scale</span></div><div class="schematics"><figure><figcaption>Cross-section</figcaption><div id="section-drawing"></div></figure><figure><figcaption id="length-caption">Member length</figcaption><div id="length-drawing"></div></figure></div><p id="schematic-note" class="schematic-note"></p></section></div>
<fieldset class="weld-panel"><legend>Optional weld</legend><label class="weld-toggle"><input id="weld-enabled" type="checkbox" aria-controls="weld-content">Include a weld joining two components</label><div id="weld-content" hidden><div class="weld-layout"><div><div id="weld-fields" class="fields"></div><div id="weld-selector-controls"></div><p id="weld-method-note" class="weld-help"></p><p id="weld-quantity-note" class="weld-help"></p></div><div class="weld-picture"><div id="weld-drawing"></div><p id="weld-dimension-note"></p></div></div></div></fieldset>
<div id="input-error" class="error" role="alert"></div></form>
<div class="outputs" aria-live="polite"><div><span id="unit-mass-label" class="result-label">Calculated mass per metre</span><strong id="mass" class="number">—</strong><span id="mass-unit" class="unit">kg/m</span></div><div><span id="total-mass-label" class="result-label">Calculated total mass</span><strong id="total" class="number">—</strong><span class="unit">kg</span></div></div>
</section></div></main>

<script>
'use strict';
const engine = window.SteelWeight, sketches = window.SteelSketch;
const $ = id => document.getElementById(id), states = new Map();
let current = 'rhs';
function icon(kind) {
  const shape = kind === 'beam' ? '<path d="M5 4H21V8H15V18H21V22H5V18H11V8H5Z"/>' : kind === 'channel' ? '<path d="M6 4H21V8H10V18H21V22H6Z"/>' : kind === 'angle' ? '<path d="M6 4H10V18H21V22H6Z"/>' : kind === 'tube' ? '<circle cx="13" cy="13" r="9"/><circle cx="13" cy="13" r="5" fill="white"/>' : kind === 'round' ? '<circle cx="13" cy="13" r="8"/>' : kind === 'hollow' ? '<rect x="5" y="4" width="16" height="18" rx="2"/><rect x="8" y="7" width="10" height="12" rx="1" fill="white"/>' : '<path d="M4 8L21 5L23 18L6 22Z"/>';

}
for (const definition of engine.shapes) {

  const text = document.createElement('span'); text.textContent = definition.title; button.append(text); button.addEventListener('click', () => selectCalculator(definition.id)); $('calculator-menu').append(button);
  const option = document.createElement('option'); option.value = definition.id; option.textContent = definition.title; $('calculator-picker').append(option);
}
function readInputs() {
  const value = Object.fromEntries(Array.from($('input-fields').querySelectorAll('[data-input]')).filter(input => !input.readOnly || input.dataset.input === 'L').map(input => [input.dataset.input, input.value]));
  value.weld = { ...((states.get(current) || {}).weld || {}), enabled: $('weld-enabled').checked, lengthUnit: 'mm', lengthMode: 'section-outline' };
  for (const input of $('weld-fields').querySelectorAll('[data-weld-input]')) value.weld[input.dataset.weldInput] = input.value;
  return value;
}
function control(key, label, unit, value, options = null, readonly = false, wide = false) {
  const wrapper = document.createElement('label'); wrapper.htmlFor = 'field-' + key; if (wide) wrapper.className = 'span-2'; wrapper.textContent = label + (unit ? ' (' + unit + ')' : '');
  const input = document.createElement(options ? 'select' : 'input'); input.id = 'field-' + key; input.dataset.input = key; input.autocomplete = 'off';
  if (options) {
    for (const choice of options) { const option = document.createElement('option'); option.value = choice.value; option.textContent = choice.label; if (choice.value === String(value)) option.selected = true; input.append(option); }
  } else { input.type = 'text'; input.inputMode = 'decimal'; input.value = value; input.readOnly = readonly; if (readonly) input.setAttribute('aria-readonly', 'true'); }
  input.addEventListener('input', () => { if (!options && !readonly) calculate(); });
  input.addEventListener('change', () => { if (options) selectionChanged(key); });
  input.addEventListener('focus', () => highlight(key)); input.addEventListener('blur', () => highlight(null));
  wrapper.append(input); $('input-fields').append(wrapper); return input;
}
function highlight(key) { for (const group of document.querySelectorAll('[data-dimension]')) group.classList.toggle('active', group.dataset.dimension === key || (key === 'pair' && ['A', 'B'].includes(group.dataset.dimension))); }
function highlightFocused() { const active = document.activeElement; if (active && active.dataset) highlight(active.dataset.weldInput ? 'weld-' + active.dataset.weldInput : active.dataset.input); }
function paintSteelSchematics(definition, result) { $('section-drawing').innerHTML = sketches.section(definition, result); $('length-drawing').innerHTML = sketches.member(definition, result); }
function changeWeldEdge(id, amount) {
  const value = readInputs(); value.weld.edges = { ...(value.weld.edges || {}), [id]: amount }; value.weld.activeEdge = id; states.set(current, value); calculate();
}
function renderWeldSelectorControls() {
  $('weld-selector-controls').innerHTML = '<section class="weld-selector" aria-labelledby="weld-selector-heading"><div class="selector-heading"><strong id="weld-selector-heading">Select welded edges</strong><button id="weld-clear" type="button">Clear</button></div><div id="weld-coverage"></div><div id="weld-edge-editor" class="edge-editor" hidden><label>Edge to edit<select id="weld-edge-picker"></select></label><label class="full-edge-toggle"><input id="weld-edge-full" type="checkbox">Entire edge</label><label>Welded length on this edge (mm)<input id="weld-edge-length" type="text" inputmode="decimal" autocomplete="off"></label><span id="weld-edge-available" class="edge-available"></span></div></section>';
  $('weld-edge-picker').addEventListener('change', () => { const value = readInputs(); value.weld.activeEdge = $('weld-edge-picker').value; states.set(current, value); calculate(); });
  $('weld-edge-full').addEventListener('change', () => { changeWeldEdge($('weld-edge-picker').value, $('weld-edge-full').checked ? 'full' : '0'); if (!$('weld-edge-full').checked) { $('weld-edge-length').focus(); if (typeof $('weld-edge-length').select === 'function') $('weld-edge-length').select(); } });
  $('weld-edge-length').addEventListener('input', () => changeWeldEdge($('weld-edge-picker').value, $('weld-edge-length').value));
  $('weld-clear').addEventListener('click', () => { if($('weld-clear').disabled)return; const value = readInputs(); const model = engine.automaticWeldPath(current,value); value.weld.edges = Object.fromEntries(model.segments.map(edge=>[edge.id,'0'])); states.set(current,value); calculate(); });
  function toggle(event, keyboard) {
    const edge = event.target.closest('[data-weld-edge]'); if (!edge || edge.getAttribute('aria-disabled') === 'true') return;
    let id = edge.dataset.weldEdge;
    if(!keyboard && event.isTrusted && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)) {
      const svg=$('weld-coverage').querySelector('svg'),point=new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse());let nearest=Infinity;
      for(const hit of svg.querySelectorAll('path[pointer-events="stroke"]')) {
        const total=hit.getTotalLength(),steps=hit.getAttribute('d').includes('A')?32:1;let a=hit.getPointAtLength(0);
        for(let i=1;i<=steps;i++) { const b=hit.getPointAtLength(total*i/steps),dx=b.x-a.x,dy=b.y-a.y,square=dx*dx+dy*dy,f=square?Math.max(0,Math.min(1,((point.x-a.x)*dx+(point.y-a.y)*dy)/square)):0,distance=(point.x-a.x-f*dx)**2+(point.y-a.y-f*dy)**2;if(distance<nearest){nearest=distance;id=hit.closest('[data-weld-edge]').dataset.weldEdge;}a=b; }
      }
    }
    const value = readInputs(), raw = (value.weld.edges || {})[id];
    changeWeldEdge(id, raw == null || raw === 'full' || Number(String(raw).replace(',','.')) > 0 ? '0' : 'full');
    if (keyboard) { const next = $('weld-coverage').querySelector('[data-weld-edge="'+id+'"]'); if (next && typeof next.focus === 'function') next.focus(); }
  }
  $('weld-coverage').addEventListener('click', event => toggle(event,false));
  $('weld-coverage').addEventListener('keydown', event => { if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(event,true); } });
}
function refreshWeldPath(input) {
  try {
    const model = engine.automaticWeldPath(current,input), choices = input.weld.edges || {};
    $('weld-clear').disabled=false;
    let selected = null; try { selected = engine.selectedWeldPath(model,choices); } catch (_) {}
    $('weld-lengthMm').value = selected ? engine.format(selected.lengthMm) : ''; $('weld-lengthMm').title = model.basis;
    const active = model.segments.some(edge=>edge.id === input.weld.activeEdge) ? input.weld.activeEdge : model.segments[0].id;
    input.weld.activeEdge = active;
    $('weld-coverage').innerHTML = sketches.weldSelector(engine.shape(current),model,choices,active);
    const picker = $('weld-edge-picker'), signature = model.segments.map(edge=>edge.id+edge.name).join('|');
    if(picker.dataset.signature !== signature) { picker.replaceChildren(); for(const edge of model.segments) { const option = document.createElement('option'); option.value=edge.id; option.textContent=edge.name; picker.append(option); } picker.dataset.signature=signature; }
    picker.value = active; $('weld-edge-editor').hidden = false;
    const edge = model.segments.find(edge=>edge.id===active), raw = Object.prototype.hasOwnProperty.call(choices,active)?choices[active]:'full', whole = raw==='full';
    $('weld-edge-full').checked=whole; $('weld-edge-full').disabled=Number(edge.lengthMm)===0;
    const editor = $('weld-edge-length'); editor.readOnly=whole; editor.setAttribute('aria-readonly',String(whole));
    if(document.activeElement !== editor) editor.value=whole?engine.format(edge.lengthMm):raw;
    $('weld-edge-available').textContent='Available: '+engine.format(edge.lengthMm)+' mm'; $('weld-edge-available').title=edge.lengthMm+' mm';
    input.weld.lengthMm=selected?selected.lengthMm:''; input.weld.runs='1';
  } catch (_) { $('weld-lengthMm').value=''; $('weld-lengthMm').title=''; $('weld-coverage').innerHTML=''; $('weld-edge-editor').hidden=true; $('weld-clear').disabled=true; }
}
function weldControl(key, label, unit, value, options = null, help = '') {
  const wrapper = document.createElement('label'); wrapper.htmlFor = 'weld-' + key; wrapper.textContent = label + (unit ? ' (' + unit + ')' : '');
  const input = document.createElement(options ? 'select' : 'input'); input.id = 'weld-' + key; input.dataset.weldInput = key;
  if (options) for (const choice of options) { const option = document.createElement('option'); option.value = choice.value; option.textContent = choice.label; option.selected = choice.value === String(value); input.append(option); }
  else { input.type = 'text'; input.inputMode = 'decimal'; input.autocomplete = 'off'; input.value = value == null ? '' : value; }
  input.addEventListener(options ? 'change' : 'input', () => {
    if (key === 'type' || key === 'connection') { const state = readInputs(); states.set(current, state); renderWeld(state); $('weld-' + key).focus(); }
    calculate();
  });
  input.addEventListener('focus', () => highlight('weld-' + key)); input.addEventListener('blur', () => highlight(null));
  wrapper.append(input); if (help) { const note = document.createElement('small'); note.className = 'field-help'; note.textContent = help; note.id = 'help-' + key; input.setAttribute('aria-describedby', note.id); wrapper.append(note); } $('weld-fields').append(wrapper);
}
function renderWeld(value) {
  const weld = value.weld || {}, active = weld.enabled === true, unit = current === 'plate' ? 'mm' : 'm';
  $('weld-enabled').checked = active; $('weld-content').hidden = !active; $('weld-fields').replaceChildren(); $('weld-selector-controls').replaceChildren();
  const length = $('field-L'); length.readOnly = active; length.setAttribute('aria-readonly', String(active));
  length.parentElement.firstChild.nodeValue = active ? 'Total material length (' + unit + ')' : 'Length L (' + unit + ')';
  if (!active) return;
  weldControl('L1', 'First piece length', 'mm', weld.L1); weldControl('L2', 'Second piece length', 'mm', weld.L2);
  weldControl('connection', 'Connection shape', '', weld.connection || 'straight', [{ value: 'straight', label: 'Straight connection' }, { value: 'L', label: 'L connection — 90°' }]);
  weldControl('type', 'Weld type', '', weld.type || 'fillet', [{ value: 'fillet', label: 'Fillet — equal legs' }, { value: 'butt', label: 'Butt — gap and reinforcement' }]);
  weldControl('lengthMm', 'Automatic weld length', 'mm', '');
  const weldLength = $('weld-lengthMm'); weldLength.readOnly = true; weldLength.setAttribute('aria-readonly', 'true');
  renderWeldSelectorControls();
  if (weld.type === 'butt') {
    weldControl('gapMm', 'Gap between pieces', 'mm', weld.gapMm == null ? '0' : weld.gapMm);
    weldControl('capWidthMm', 'Weld cap width', 'mm', weld.capWidthMm);
    weldControl('capHeightMm', 'Weld cap height', 'mm', weld.capHeightMm == null ? '0' : weld.capHeightMm);
    weldControl('faces', 'Weld reinforcement on', '', weld.faces || '1', [{ value: '1', label: 'One side' }, { value: '2', label: 'Both sides' }]);
  } else weldControl('z', 'Fillet leg size', 'mm', weld.z);
  $('weld-method-note').textContent = 'Click an edge to toggle its weld. Choose an edge above to enter a partial length.';
  $('weld-quantity-note').textContent = 'All weld dimensions and both piece lengths are in millimetres. The pieces use the selected steel section. ' + (weld.connection === 'L' ? 'For the L connection, their sum is the total material used, not an overall width or height. ' : 'Their sum is the total material length. ') + (current === 'plate' ? 'One joint per assembled piece; the piece count multiplies both steel and added weld mass.' : 'One joint joins the two pieces.');
  $('weld-dimension-note').textContent = 'Match the field names to the arrows. Orange marks the weld. The drawing remains visible while measurements are empty. Schematic, not to scale.';
  $('weld-drawing').innerHTML = sketches.weldGuide({ ...value, weld: { ...weld, lengthUnit: 'mm' } });
}
function angleOptions(definition, value) {
  const rows = engine.profiles(current);
  if (current === 'equal_angle') control('A', 'Side A', 'mm', value.A, Array.from(new Set(rows.map(r => r.A))).map(a => ({ value: a, label: a })));
  else control('pair', 'Outside sides A × B', 'mm', value.pair, Array.from(new Set(rows.map(r => r.A + 'x' + r.B))).map(pair => ({ value: pair, label: pair.replace('x', ' × ') })));
  const available = rows.filter(r => current === 'equal_angle' ? r.A === value.A : r.A + 'x' + r.B === value.pair);
  const thickness = available.some(r => r.t === value.t) ? value.t : available[0].t;
  control('t', 'Thickness t', 'mm', thickness, available.map(r => ({ value: r.t, label: r.t })));
  control('L', 'Length L', 'm', value.L);
}
function renderInputs(value) {
  const definition = engine.shape(current); $('input-fields').replaceChildren();
  if (!definition.family) for (const field of definition.fields) control(field.key, field.label, field.unit, value[field.key]);
  else if (definition.kind === 'angle') angleOptions(definition, value);
  else {
    control('profile', 'Profile', '', value.profile, engine.profiles(current).map(p => ({ value: p.id, label: p.label })), false, true);
    const selected = engine.profile(current, value);
    const title = document.createElement('div'); title.className = 'profile-fields-title'; title.textContent = 'Profile dimensions'; $('input-fields').append(title);
    control('h', 'Height h', 'mm', selected.h, null, true); control('b', 'Flange width b', 'mm', selected.b, null, true);
    control('s', 'Web thickness s', 'mm', selected.s, null, true); control('t', 'Flange thickness t', 'mm', selected.t, null, true);
    control('L', 'Length L', 'm', value.L);
  }
  renderWeld(value);
}
function selectionChanged(key) {
  const value = readInputs(), definition = engine.shape(current);
  if (definition.kind === 'angle' && key !== 't') {
    const rows = engine.profiles(current).filter(r => current === 'equal_angle' ? r.A === value.A : r.A + 'x' + r.B === value.pair);
    if (!rows.some(r => r.t === value.t)) value.t = rows[0].t;
  }
  states.set(current, value); renderInputs(value); const next = $('field-' + key); if (next && typeof next.focus === 'function') next.focus(); calculate();
}
function calculate() {
  const definition = engine.shape(current), input = readInputs(); states.set(current, input);
  $('unit-mass-label').textContent = current === 'plate' ? 'Calculated mass per piece' : 'Calculated mass per metre'; $('mass-unit').textContent = current === 'plate' ? 'kg/piece' : 'kg/m';
  $('total-mass-label').textContent = input.weld.enabled ? 'Total including added weld' : 'Calculated total mass';
  $('length-caption').textContent = current === 'plate' ? 'Plate length' : 'Member length';
  if (input.weld.enabled) { refreshWeldPath(input); $('weld-drawing').innerHTML = sketches.weldGuide(input); }
  try {
    const result = engine.calculate(current, input); $('input-error').textContent = '';
    if (result.weld) { $('field-L').value = result.input.L; states.set(current, { ...input, L: result.input.L }); }
    $('mass').textContent = engine.format(result.unitMassKg); $('mass').title = 'Unrounded: ' + result.unitMassKg;
    $('total').textContent = engine.format(result.totalKg); $('total').title = 'Unrounded: ' + result.totalKg;
    $('unit-mass-label').textContent = result.metric === 'piece' ? 'Calculated mass per piece' : 'Calculated mass per metre'; $('mass-unit').textContent = result.metric === 'piece' ? 'kg/piece' : 'kg/m';
    if (result.weld) $('unit-mass-label').textContent = result.metric === 'piece' ? 'Steel mass per assembled piece' : 'Steel mass per metre';
    paintSteelSchematics(definition, result);
    if (result.weld) $('weld-drawing').innerHTML = sketches.weld(result);
    highlightFocused();
    return result;
  } catch (error) {
    $('input-error').textContent = error.message; $('mass').textContent = $('total').textContent = '—'; $('mass').title = $('total').title = '';
    if (input.weld.enabled) { try { $('field-L').value = engine.weldSteelLength(current, input.weld); } catch (_) { $('field-L').value = ''; } }
    try { paintSteelSchematics(definition, engine.calculate(current, { ...input, L: $('field-L').value || input.L, weld: { enabled: false } })); }
    catch (_) { $('section-drawing').innerHTML = sketches.placeholder('Enter valid section dimensions.'); $('length-drawing').innerHTML = sketches.placeholder('Enter a valid section and length.'); }
    highlightFocused(); return null;
  }
}
function selectCalculator(id) {
  engine.shape(id); if ($('input-fields').children.length) states.set(current, readInputs()); current = id;
  const definition = engine.shape(id); $('page-heading').textContent = definition.title; document.title = definition.title + ' — Steel Shape';
  $('inputs-heading').textContent = definition.family ? 'Choose a profile' : 'Enter dimensions'; $('calculator-picker').value = id;
  for (const button of $('calculator-menu').querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.shape === id));
  $('length-caption').textContent = id === 'plate' ? 'Plate length' : 'Member length';
  $('schematic-note').textContent = id === 'plate' ? 'Dimensions t, W and L are in millimetres. The piece count multiplies the total mass.' : definition.family && definition.kind !== 'angle' ? 'h is height, b is flange width, s is web thickness and t is flange thickness. L is in metres.' : definition.kind === 'tube' ? 'D is the outside diameter and t is the wall thickness, in millimetres. L is in metres.' : 'Cross-section dimensions are in millimetres. L is the member length in metres.';
  renderInputs(states.get(id) || engine.defaults(id)); calculate();
}
$('calculator-form').addEventListener('submit', event => { event.preventDefault(); calculate(); });
$('calculator-picker').addEventListener('change', () => selectCalculator($('calculator-picker').value));
$('weld-enabled').addEventListener('change', () => {
  const value = readInputs();
  if (value.weld.enabled && value.weld.L1 == null) { let half = ''; try { half = engine.convertLength(engine.splitLength(value.L), current === 'plate' ? 'mm' : 'm', 'mm'); } catch (_) {} value.weld = { ...value.weld, L1: half, L2: half, lengthUnit: 'mm', connection: 'straight', type: 'fillet', lengthMode: 'section-outline', gapMm: '0', capHeightMm: '0', faces: '1' }; }
  states.set(current, value); renderWeld(value); calculate();
});
selectCalculator('rhs');
</script></body></html>
