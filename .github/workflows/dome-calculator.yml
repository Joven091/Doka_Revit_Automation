name: Dome calculator and existing calculator checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/MyRevitAddin.csproj -c Release --warnaserror
      - name: Compile calculator installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $installerOutput = Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer'
          & $compiler "/O$installerOutput" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Calculator installer compilation failed' }
      # Check slab controls and spacing before the slower beam layout previews.
      - run: dotnet run --project tests/Slab.CoreTests/Slab.CoreTests.csproj -c Release
      - run: dotnet run --project tests/Slab.Tests/Slab.Tests.csproj -c Release
      - run: dotnet run --project tests/Dome.Tests/Dome.Tests.csproj -c Release
      - run: dotnet run --project tests/D3Slab.Tests/D3Slab.Tests.csproj -c Release
      - run: dotnet run --project tests/D3Slab.UiSmoke/D3Slab.UiSmoke.csproj -c Release
      # The default Beam.Tests run already includes SearchReuseTests.
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release
      - name: Beam network economy regression (.NET 10)
        run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --network-economy
      # Preserve the production-runtime regression checks from the benchmark workflow.
      - name: Build beam regressions (.NET Framework 4.8)
        run: dotnet build tests/Beam.Net48/Beam.Net48.csproj -c Release --warnaserror
      - name: Beam search deadline regression (.NET Framework 4.8)
        run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --search-budget
      - name: Independent network spacing regressions (.NET Framework 4.8)
        run: |
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --independent-spacing-search
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --independent-spacing-controls
      - name: Equivalent loading and external slab ends (.NET Framework 4.8)
        run: |
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --column-slab-ends
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --equivalent-loading
      - name: Beam search reuse regression (.NET Framework 4.8)
        run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --search-reuse
      - name: Beam network economy regression (.NET Framework 4.8)
        run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --network-economy
      - run: dotnet run --project tests/Backpropping.Tests/Backpropping.Tests.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: revit2024-addin
          path: |
            MyRevitAddin.addin
            src/bin/Release/net48/MyRevitAddin.dll
            src/bin/Release/net48/OxyPlot*.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: revit2024-calculator-installer
          path: artifacts/installer/Install_DokaRevitAutomation.exe
          if-no-files-found: error

  beam-ui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Check interactive controls before the slower calculation/search regressions.
      - name: Beam UI checks and previews
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet run --project tests/Beam.UiSmoke/Beam.UiSmoke.csproj -c Release -- artifacts/beam.png
      - name: Emit inspectable section previews
        if: always()
        run: ./scripts/emit-ui-previews.ps1 -Directory artifacts -Names beam.workspace-section.png,beam.section-520.png,beam.current-report-section.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-ui-previews
          path: artifacts/
          if-no-files-found: ignore
