name: Revit selection import
on:
  pull_request:
    paths: ['src/**', 'tests/Beam*/**', 'tests/Revit.Reader*/**', 'tests/Revit.Modeless.Tests/**', 'tests/D3Slab.Tests/**', 'Directory.Build.props', '.github/workflows/revit-selection-import.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/Beam*/**', 'tests/Revit.Reader*/**', 'tests/Revit.Modeless.Tests/**', 'tests/D3Slab.Tests/**', 'Directory.Build.props', '.github/workflows/revit-selection-import.yml']
  workflow_dispatch:
concurrency:
  group: revit-selection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selection-import:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/MyRevitAddin.csproj -c Release --warnaserror
      - run: dotnet run --project tests/Revit.Modeless.Tests -c Release
      - run: dotnet run --project tests/Revit.Reader.Tests -c Release
      - run: dotnet run --project tests/Beam.Tests -c Release -- --revit-selection
      - run: dotnet run --project tests/Beam.Tests -c Release -- --revit-topology
      - run: dotnet run --project tests/Beam.Tests -c Release -- --revit-alignment
      - run: dotnet run --project tests/Beam.Tests -c Release -- --revit-perimeter
      - run: dotnet run --project tests/Beam.Tests -c Release -- --revit-junctions
      - run: dotnet run --project tests/Beam.Tests -c Release -- --revit-selection-size
      - run: dotnet run --project tests/Beam.Tests -c Release -- --individual-spans
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: dotnet build tests/Revit.Reader.Net48 -c Release --warnaserror
      - run: tests/Revit.Reader.Net48/bin/Release/net48/Revit.Reader.Tests.exe
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --revit-selection
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --revit-topology
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --revit-alignment
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --revit-perimeter
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --revit-junctions
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --revit-selection-size
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --individual-spans
      - run: dotnet build tests/Beam.UiSmoke -c Release --warnaserror
      - name: One-click selection, retained diagnosis, combined canvas and undo
        run: |
          New-Item -ItemType Directory -Force tests/revit-selection-preview | Out-Null
          tests/Beam.UiSmoke/bin/Release/net48/MyRevitAddin.exe --revit-selection-ui tests/revit-selection-preview/import.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Emit inspectable import preview
        run: ./scripts/emit-ui-previews.ps1 -Directory tests/revit-selection-preview -Names import.png,individual-spans.png,column-cutbacks.png,combined-import.png,combined-formwork.png,aligned-import.png,perimeter-import.png,column-member-selected.png,junction-import.png,junction-row-selected.png,large-selection-import.png,large-crossing-selected.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revit-selection-preview
          path: tests/revit-selection-preview/*.png
