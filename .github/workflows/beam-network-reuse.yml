name: Beam network reuse and reported-case benchmark
on:
  pull_request:
    paths: ['src/Models/**', 'tests/Beam.Tests/**', 'tests/Beam.Net48/**', '.github/workflows/beam-network-reuse.yml']
concurrency:
  group: beam-network-reuse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --network-search-reuse
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --crossing-local-reuse
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --custom-h20-scope
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --search-budget
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --prepared-receivers
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --primary-joint-rows
      - name: Complete catalogue-only and custom-project models on the production runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/network-reuse | Out-Null
          foreach ($model in @('eight-catalogue','three-custom-slabs')) {
            tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --controlled-performance --model $model --seconds 900 | Tee-Object -FilePath "artifacts/network-reuse/optimized-$model-net48.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/checkout@v4
        with:
          # Compare with the exact 1.1.4 source used by the uploaded diagnosis.
          ref: d4fcdc22414a027f28125bfd8becd1cabee84e25
          path: work/network-baseline
      - name: Build the previous solver with exactly the same input driver
        shell: pwsh
        run: |
          Copy-Item tests/Beam.Tests/ControlledPerformanceTests.cs work/network-baseline/tests/Beam.Tests/
          dotnet build work/network-baseline/tests/Beam.Net48 -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Complete previous version on the same runner
        shell: pwsh
        run: |
          foreach ($model in @('eight-catalogue','three-custom-slabs')) {
            work/network-baseline/tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --controlled-performance --model $model --seconds 900 | Tee-Object -FilePath "artifacts/network-reuse/baseline-$model-net48.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compare complete designs and elapsed time
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('artifacts/network-reuse')
          def design(text):
              assert 'prefixOnly=False' in text, 'A cancelled prefix is not a complete benchmark'
              return text.split('FINGERPRINT BEGIN\n',1)[1].split('FINGERPRINT END',1)[0].strip()
          elapsed=lambda text:float(re.search(r'PERFORMANCE .*? wall=([\d.]+)',text)[1])
          summaries=[]
          for model in ('eight-catalogue','three-custom-slabs'):
              before=(root/f'baseline-{model}-net48.txt').read_text(encoding='utf-8-sig')
              after=(root/f'optimized-{model}-net48.txt').read_text(encoding='utf-8-sig')
              assert design(before)==design(after), f'{model}: geometry, UDLs, reactions or quantities changed'
              old,new=elapsed(before),elapsed(after)
              if model=='eight-catalogue':
                  assert new<old, 'Catalogue-only runtime did not improve'
              else:
                  assert new<=max(30,old*1.25), 'Custom-project runtime materially regressed'
              summaries.append(f'{model}: {old:.3f} s -> {new:.3f} s ({old/new:.2f}x). Selected geometry, UDLs, reactions and quantities match.')
          summary='\n'.join(summaries)+'\n'
          print(summary)
          (root/'comparison.txt').write_text(summary)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-network-reuse-benchmark
          path: artifacts/network-reuse/
          if-no-files-found: ignore
