name: Beam profiling toolchain
on:
  pull_request:
    paths:
      - '.github/workflows/beam-profile-bootstrap.yml'
jobs:
  linux-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/work/dotnet-sdk
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package the isolated numerical-test SDK
        run: |
          mkdir -p work
          tar -C work/dotnet-sdk -czf work/numerical-sdk.tar.gz .
          split -b 24M -d -a 2 work/numerical-sdk.tar.gz work/sdk-part-
          sha256sum work/numerical-sdk.tar.gz work/sdk-part-*
      - uses: actions/upload-artifact@v4
        with:
          name: beam-sdk-00
          path: work/sdk-part-00
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: beam-sdk-01
          path: work/sdk-part-01
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: beam-sdk-02
          path: work/sdk-part-02
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: beam-sdk-03
          path: work/sdk-part-03
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
