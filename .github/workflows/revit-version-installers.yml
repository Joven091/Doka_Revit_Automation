name: Revit 2024 and 2027 installer acceptance
on:
  pull_request:
    paths: ['.github/workflows/revit-version-installers.yml', 'scripts/Prepare-DashboardCompanyFiles.ps1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revit-version-installers-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        revit: [2024, 2027]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare native desktop prerequisites on disposable runner
        shell: pwsh
        run: ./scripts/Ensure-SteelShapeTestBrowser.ps1
      - name: Build the Revit-specific bridge and matching Dashboard
        shell: pwsh
        run: ./scripts/Build-DashboardLiveUpdate.ps1 -OutputDirectory artifacts/live -Version 1.2.3 -RevitVersion ${{ matrix.revit }}
      - name: Verify host isolation and actual bridge API/runtime metadata
        shell: pwsh
        run: |
          dotnet run --project tests/DashboardHostVersions.Tests -c Release -- artifacts/live/bootstrap/Doka.RevitBridge.dll ${{ matrix.revit }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and perform isolated install, upgrade, guards and uninstall
        shell: pwsh
        run: |
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          ./scripts/Build-DashboardInstaller.ps1 -Compiler $compiler -BuildDirectory artifacts/live -OutputDirectory artifacts/installer
          $installer=(Get-ChildItem artifacts/installer/*.exe).FullName
          ./scripts/Test-DashboardInstaller.ps1 -Installer $installer -BuildDirectory artifacts/live -EvidenceDirectory artifacts/evidence/installer
      - name: Verify production contracts and native installed desktop
        shell: pwsh
        run: |
          dotnet build tests/DashboardUpdates.Tests -c Release -f net48 --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/DashboardUpdates.Tests/bin/Release/net48/DashboardUpdates.Tests.exe *> artifacts/evidence/update-core.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/evidence/update-core.log; throw 'Update contracts failed' }
          dotnet build tests/DashboardDesktop.Smoke -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result=Get-Content artifacts/evidence/installer/result.json -Raw | ConvertFrom-Json
          Copy-Item ($result.freshEntry+'.config') tests/DashboardDesktop.Smoke/bin/Release/net48/DashboardDesktop.Smoke.exe.config -Force
          $env:DOKA_DASHBOARD_REVIT_VERSION='${{ matrix.revit }}'
          & tests/DashboardDesktop.Smoke/bin/Release/net48/DashboardDesktop.Smoke.exe $result.freshEntry artifacts/evidence/installed-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the exact company-folder layout and both JSON indexes
        shell: pwsh
        run: |
          ./scripts/Prepare-DashboardCompanyFiles.ps1 -InstallerDirectory artifacts/installer -BuildDirectory artifacts/live -OutputDirectory artifacts/company-files
          $source=if(${{ matrix.revit }} -eq 2024){'artifacts/company-files'}else{'artifacts/company-files/Revit2027'}
          dotnet run --project tests/DashboardHostVersions.Tests -c Release -- artifacts/live/bootstrap/Doka.RevitBridge.dll ${{ matrix.revit }} $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Revit${{ matrix.revit }}-1.2.3-installer-and-update-files
          path: artifacts/company-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Revit${{ matrix.revit }}-1.2.3-validation
          path: |
            artifacts/evidence/
            artifacts/installer/installer-compile.log
          if-no-files-found: warn
