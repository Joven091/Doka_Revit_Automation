name: Positioned secondary transfer
on: [pull_request]
jobs:
  required-rows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --local-receiving-rows
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --required-rows
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --local-receiving-rows
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --required-rows
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --local-receiving-report
  next-search-speed:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --next-search-speed
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --next-search-speed
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --search-reuse
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --search-worker-benchmark
  centred-search-speed:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --centred-search-speed
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --centred-search-speed
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --centred-speed-report
  slab-plywood-edges:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --slab-plywood-edges
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --custom-h20-scope
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --independent-spacing-search
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --independent-spacing-controls
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --slab-plywood-edges
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --slab-plywood-report
  slab-legacy-supports:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --uplift-reported
  positioned-transfer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --positioned-transfer
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --equivalent-loading
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --positioned-transfer
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --equivalent-loading
  positioned-fallback:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --positioned-fallback
  positioned-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Beam.UiSmoke -c Release --warnaserror
      - run: |
          New-Item -ItemType Directory -Force tests/positioned-preview | Out-Null
          tests/Beam.UiSmoke/bin/Release/net48/MyRevitAddin.exe --positioned-ui tests/positioned-preview/beam.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positioned-transfer-ui-preview
          path: tests/positioned-preview/*.png
  centred-crossings:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --centred-crossings
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --secondary-setting-out
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --centred-crossings
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --secondary-setting-out
