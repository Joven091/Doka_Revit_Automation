name: Positioned secondary transfer
on: [pull_request]
jobs:
  positioned-transfer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --positioned-transfer
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --equivalent-loading
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --positioned-transfer
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --equivalent-loading
  positioned-fallback:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --positioned-fallback
  positioned-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Beam.UiSmoke -c Release --warnaserror
      - run: |
          New-Item -ItemType Directory -Force tests/positioned-preview | Out-Null
          tests/Beam.UiSmoke/bin/Release/net48/MyRevitAddin.exe --positioned-ui tests/positioned-preview/beam.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positioned-transfer-ui-preview
          path: tests/positioned-preview/*.png
  positioned-fallback-reference:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --positioned-fallback-reference
