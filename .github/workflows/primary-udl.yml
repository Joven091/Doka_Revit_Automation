name: Primary UDL design checks
on: [pull_request]
jobs:
  d3-drawing-workspace:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release -- --ws10
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --side-shutters
      - run: dotnet build tests/Beam.UiSmoke/Beam.UiSmoke.csproj -c Release --warnaserror
      - run: |
          New-Item -ItemType Directory -Force tests/d3-ui-preview | Out-Null
          tests/Beam.UiSmoke/bin/Release/net48/MyRevitAddin.exe --ws10-ui tests/d3-ui-preview/beam.png
          tests/Beam.UiSmoke/bin/Release/net48/MyRevitAddin.exe --drawing-ui tests/d3-ui-preview/beam.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-drawing-preview
          path: tests/d3-ui-preview/*.png
  primary-udl:
    runs-on: windows-latest
    # Run the reported coordinated layout on both runtimes, then its WPF previews.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release -- --primary-udl
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --slab-end-loads
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --slab-end-loads-reported
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --primary-udl-reported
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --network-fallback
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --custom-h20-scope
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --local-shutters
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --cross-junction
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --cross-end-strips
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --cross-reported
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --uplift
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --uplift-reported
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --beam-options
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --coordinated-designer
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --symmetric-slab-supports
      - run: dotnet build tests/Beam.Net48/Beam.Net48.csproj -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --ws10
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --primary-udl
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --slab-end-loads
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --slab-end-loads-reported
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --primary-udl-reported
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --uplift
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --network-fallback
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --custom-h20-scope
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --local-shutters
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --side-shutters
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --cross-junction
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --cross-end-strips
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --cross-reported
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --cross-supports
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --beam-options
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --coordinated-designer
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --symmetric-slab-supports
      - run: dotnet build tests/Beam.UiSmoke/Beam.UiSmoke.csproj -c Release --warnaserror
      - run: |
          New-Item -ItemType Directory -Force tests/beam-ui-preview
          tests/Beam.UiSmoke/bin/Release/net48/MyRevitAddin.exe tests/beam-ui-preview/beam.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-ui-preview
          path: tests/beam-ui-preview/*.png
