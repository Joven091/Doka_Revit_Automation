name: Beam search reuse and reported-case benchmark
on: [push, pull_request]
jobs:
  beam-search:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release -- --search-reuse
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --reported-benchmark
