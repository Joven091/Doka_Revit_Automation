name: Beam search reuse and reported-case benchmark
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beam-search:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release -- --search-budget
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --search-reuse
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --reported-benchmark
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --network-economy
  beam-search-net48:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Beam.Net48/Beam.Net48.csproj -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --search-budget
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --search-reuse
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --network-economy
