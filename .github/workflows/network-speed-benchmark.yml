name: Network numerical reuse controlled benchmark
on: [pull_request]
jobs:
  net10:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Beam.Tests/Beam.Tests.csproj -c Release --warnaserror
      - run: dotnet run --project tests/Beam.Tests/Beam.Tests.csproj -c Release --no-build -- --network-speed-benchmark
  net48:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Beam.Net48/Beam.Net48.csproj -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --network-speed-benchmark
