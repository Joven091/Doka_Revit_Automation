name: Crossing secondaries on existing primaries
on: [pull_request]
concurrency:
  group: primary-bearing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/MyRevitAddin.csproj -c Release --warnaserror
      - run: dotnet run --project tests/Beam.Tests -c Release -- --primary-bearings
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --crossing-search
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --primary-bearings
      - name: Complete uploaded eight-beam case on .NET Framework 4.8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --primary-bearing-benchmark | Tee-Object -FilePath artifacts/primary-bearing-eight-net48.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet run --project tests/Beam.UiSmoke -c Release -- --primary-bearing-ui
      - run: dotnet run --project tests/Beam.UiSmoke -c Release --no-build -- --preview-smoke
      - name: Package standalone test preview
        shell: pwsh
        run: |
          Copy-Item tests/Beam.UiSmoke/start-preview.cmd tests/Beam.UiSmoke/bin/Release/net48/start-preview.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: primary-bearing-standalone-preview
          path: tests/Beam.UiSmoke/bin/Release/net48/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary-bearing-benchmark
          path: artifacts/*.txt
          if-no-files-found: ignore
