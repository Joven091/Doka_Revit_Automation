name: Controlled beam performance
on: [pull_request]
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --next-search-speed
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --controlled-performance --model reported --profile --seconds 120
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - name: Profile production-runtime search
        run: |
          New-Item -ItemType Directory -Force work/performance | Out-Null
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --controlled-performance --model reported --profile --seconds 240 | Tee-Object -FilePath work/performance/profile-net48.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-beam-profile
          path: work/performance/*.txt
