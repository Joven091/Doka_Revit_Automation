name: Crossing search and reported eight-beam model
on: [pull_request]
concurrency:
  group: crossing-search-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crossing-search:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Beam.Tests -c Release -- --crossing-search
      - run: dotnet run --project tests/Beam.Tests -c Release --no-build -- --prepared-receivers
      - run: dotnet build tests/Beam.Net48 -c Release --warnaserror
      - run: tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --crossing-search
      - name: Validate first complete reported eight-beam network
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --controlled-performance --model eight-crossings --variant feasibility | Tee-Object -FilePath artifacts/eight-beam-feasibility-net48.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Complete reported eight-beam model on production runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          tests/Beam.Net48/bin/Release/net48/Beam.Net48.exe --controlled-performance --model eight-crossings | Tee-Object -FilePath artifacts/eight-beam-net48.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eight-beam-search-results
          path: artifacts/*.txt
